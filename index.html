<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stores Dashboard</title>

<!-- PWA: installability. Chrome/Android read the manifest; iOS Safari
     ignores it and needs these specific meta tags + apple-touch-icon
     instead, which is why both are present. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17233b">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stores Dashboard">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1a73e8;
    --blue-dark: #1557b0;
    --bg: #dde3ea;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --text: #1f2430;
    --text-muted: #666;
    --sidebar-bg: #17233b;
    --sidebar-text: #cfd8e6;
    --sidebar-active: #24365a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text); background: var(--bg);
    /* Very subtle gradient, deliberately kept within a tight range of the
       same tone -- enough to add a touch of depth without shifting text
       contrast meaningfully anywhere on the page, which matters here since
       none of the 17 pages' own text colors were designed with a varying
       background in mind. */
    background: linear-gradient(135deg, #dde3ea, #d3dae2);
  }
  /* Headings inside the content area use Barlow Condensed -- this applies
     across all 17 pages at once without touching any of their own files,
     because each page's own font-family rule on <body> was already
     removed as part of an earlier fix (the leaking body{} CSS bug), so
     heading/body text in the content area has been inheriting from the
     shell ever since. */
  #pageContainer h1, #pageContainer h2, #pageContainer h3 {
    font-family: 'Barlow Condensed', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 600;
  }

  /* ---------- LOGIN SCREEN ---------- */
  #loginScreen {
    height: 100vh; width: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #17233b, #1a73e8);
  }
  #loginCard {
    background: var(--card-bg); border-radius: 12px; padding: 36px 32px;
    width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  #loginCard h1 { font-size: 20px; margin: 0 0 4px; }
  #loginCard .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  #loginCard label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
  #loginCard input {
    width: 100%; padding: 10px 12px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px;
  }
  #loginCard input:focus { outline: none; border-color: var(--blue); }
  #loginCard button {
    margin-top: 22px; width: 100%; padding: 11px; font-size: 15px; font-weight: 600;
    border: none; border-radius: 8px; background: var(--blue); color: white; cursor: pointer;
  }
  #loginCard button:hover { background: var(--blue-dark); }
  #loginCard button:disabled { background: #99a3b0; cursor: not-allowed; }
  #loginErrorShell {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
    background: #fce8e6; color: #c5221f; display: none;
  }

  /* ---------- APP SHELL ---------- */
  #appShell { display: none; height: 100vh; width: 100%; overflow: hidden; }

  #sidebar {
    width: 250px; flex-shrink: 0; background: var(--sidebar-bg); color: var(--sidebar-text);
    display: flex; flex-direction: column; transition: margin-left 0.2s ease, width 0.2s ease;
    overflow: hidden;
  }
  /* Collapsed = a slim icon-only rail, not a fully hidden sidebar -- icons
     stay visible and clickable, only the text labels disappear. */
  #sidebar.collapsed { width: 64px !important; }
  /* navLabel (page name next to each icon) and brandText (top logo's title)
     are safe with display:none -- they don't affect row height, since a
     navItem row's height comes from its icon regardless of whether the
     text next to it is present.
     navGroupLabel is different and MUST use visibility:hidden instead:
     display:none removes its block-level height from the layout entirely,
     which shifts every icon below it upward to fill that space -- and
     since there are 4 group labels stacked down the sidebar, that shift
     compounds group after group, moving icons further and further from
     their expanded-view position the further down the list they are.
     visibility:hidden hides the text but keeps its box (and height)
     reserved, so every icon stays at the exact same vertical position
     whether the sidebar is collapsed or expanded. */
  #sidebar.collapsed .navLabel, #sidebar.collapsed .brandText {
    display: none;
  }
  #sidebar.collapsed .navGroupLabel {
    visibility: hidden;
  }
  /* Fixed height (not padding-based sizing) is deliberate: relying on
     content to size each row risks small, inconsistent differences row to
     row (inline SVGs carry their own baseline spacing that isn't always
     identical), which is what produced visibly uneven gaps between icons.
     A fixed height makes every row exactly the same regardless of content. */
  #sidebar.collapsed .navItem { justify-content: center; padding: 0; height: 44px; }
  #sidebar.collapsed .navItem.active { border-right: none; border-left: 3px solid var(--blue); }
  #sidebar.collapsed .brand { justify-content: center; padding: 20px 0; gap: 0; }

  #sidebar .brand {
    padding: 16px 18px; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  /* Placeholder logo box -- swap the text node for a real <img src="logo.png">
     once an official logo file is available. Sized/positioned to drop
     an image in without touching the surrounding layout. */
  #brandLogo {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: 6px;
    object-fit: cover; background: #fff;
  }
  .brandText { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .brandText .brandTitle { font-weight: 700; font-size: 15px; color: #fff; line-height: 1.2; }
  .brandText .brandSubtitle {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #8b97ad;
  }

  #navMenu { flex: 1; overflow-y: auto; padding: 10px 0; }
  .navGroupLabel {
    padding: 14px 18px 6px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: #8b97ad; white-space: nowrap;
    /* nowrap is deliberate, not just cosmetic: when collapsed, this label
       is visibility:hidden (not display:none) specifically so its height
       still reserves the correct space and icons don't shift position --
       but that only works if the height itself doesn't change. Without
       nowrap, the same text would wrap onto 2+ lines at the narrow 64px
       collapsed width instead of the 1 line it uses at full width, giving
       a DIFFERENT height and quietly reintroducing a (smaller, less
       predictable) version of the same shift this fix exists to prevent.
       The overflowing text is invisible either way (visibility:hidden, and
       #sidebar itself clips overflow), so nowrap costs nothing visually. */
  }
  .navItem {
    display: flex; align-items: center; gap: 10px; padding: 9px 18px;
    color: var(--sidebar-text); text-decoration: none; font-size: 14px; cursor: pointer;
  }
  .navItem:hover { background: rgba(255,255,255,0.06); }
  .navItem.active { background: var(--sidebar-active); color: #fff; border-right: 3px solid var(--blue); }
  .navIcon { display: flex; align-items: center; opacity: 0.9; flex-shrink: 0; }
  /* SVGs are inline by default and carry small built-in baseline spacing
     that browsers apply inconsistently -- forcing block display removes
     that as a possible source of row-to-row height variation. */
  .navIcon svg { display: block; }
  .navEmpty { padding: 16px 18px; font-size: 13px; color: #8b97ad; }

  #mainArea { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #topbar {
    height: 64px; flex-shrink: 0; background: #fff; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 12px;
  }
  #hamburgerBtn {
    display: flex; align-items: center; background: none; border: none; cursor: pointer;
    padding: 6px; color: var(--text);
  }
  /* Page title: small "Stores Module" eyebrow + the current page's own name,
     next to the hamburger -- lets someone glance at the header and know
     which page they're on, independent of the sidebar being open/collapsed. */
  #pageTitleBlock { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  #pageTitleEyebrow {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
  }
  #pageTitleName { font-size: 17px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* "Logged in as X" now stacks above the Log out button, right-aligned,
     instead of sitting inline to the left of it. */
  #topbarRight { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  #userBadge { font-size: 13px; color: var(--text-muted); }
  #topbarSpacer { flex: 1; }
  #logoutBtnShell {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; cursor: pointer; color: var(--text);
  }
  #logoutBtnShell:hover { background: #f1f3f4; }

  #pageContainer { flex: 1; overflow-y: auto; padding: 24px; }
  .pageLoading { color: var(--text-muted); font-size: 14px; padding: 40px; text-align: center; }

  /* Undo the "boxed-in narrow column" look each old standalone page used to
     have (max-width:480px on <body>). That selector only ever hits the real
     <body> element, never our container div, so pages now stretch to fill
     the available width naturally -- no per-page CSS edits needed.
     Widened from 900px: data-heavy tables (STO Dashboard etc.) were being
     forced into a horizontal scrollbar on screens that had plenty of room. */
  #pageContainer > div { max-width: 1400px; }

  /* Every page already shows its own "Logged in as X (role) [Log out]"
     bar, which is now redundant with the shell's own top-bar Log out
     button -- hide just the button, keep the informational text.
     !important is deliberate here: fragments' own generic `button{...}`
     rules apply document-wide (a <style> tag isn't scoped to where it
     sits in the DOM), so a plain rule here could lose a specificity fight
     against one of 17 different pages' own styling. This one rule is
     small and permanent, so !important is the right tool. */
  #pageContainer #logoutBtn { display: none !important; }

  /* The shell's own persistent buttons need to be immune to the SAME
     leaking-<style> problem in the other direction: several pages have
     generic `button{width:100%}` rules meant for their own single-column
     forms, which -- being global -- also stretched the shell's own Log
     out button to full width the moment such a page loaded. Lock down
     width on just the specific buttons that were actually affected, with
     concrete values (deliberately NOT `revert` -- `revert` combined with
     !important is one of the genuinely ambiguous corners of the CSS spec,
     and using it on the sidebar/topbar containers themselves is what
     broke the collapse-toggle feature below). */
  #logoutBtnShell, #hamburgerBtn, #loginBtnShell {
    width: auto !important; max-width: none !important;
  }
  #navMenu a.navItem { display: flex !important; width: auto !important; }

  @media (max-width: 860px) {
    #appShell { position: relative; }
    #sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 20;
      margin-left: -250px; width: 250px;
    }
    #sidebar.open { margin-left: 0; box-shadow: 4px 0 16px rgba(0,0,0,0.25); }
    #sidebar.collapsed { width: 250px !important; } /* on mobile, "collapsed" has no meaning -- off-canvas open/close only */
    #pageContainer { padding: 16px; }
  }
</style>
</head>
<body>

<!-- ====== LOGIN SCREEN ====== -->
<div id="loginScreen">
  <div id="loginCard">
    <h1>Stores Dashboard</h1>
    <div class="sub">Sign in with the email and password issued by the project owner.</div>

    <label for="loginEmailShell">Email</label>
    <input type="email" id="loginEmailShell" placeholder="you@test.com" onkeydown="if(event.key==='Enter')shellLogin()">

    <label for="loginPasswordShell">Password</label>
    <input type="password" id="loginPasswordShell" placeholder="Password" onkeydown="if(event.key==='Enter')shellLogin()">

    <button id="loginBtnShell" onclick="shellLogin()">Log In</button>
    <div id="loginErrorShell"></div>
  </div>
</div>

<!-- ====== APP SHELL ====== -->
<div id="appShell">
  <div id="sidebar">
    <div class="brand">
      <img id="brandLogo" src="icons/icon-192.png" alt="Company logo">
      <div class="brandText">
        <span class="brandTitle">Stores Dashboard</span>
        <span class="brandSubtitle">Electrical Planning</span>
      </div>
    </div>
    <div id="navMenu"></div>
  </div>

  <div id="mainArea">
    <div id="topbar">
      <button id="hamburgerBtn" onclick="toggleSidebar()" title="Show/hide sidebar">☰</button>
      <div id="pageTitleBlock">
        <span id="pageTitleEyebrow">Stores Module</span>
        <span id="pageTitleName"></span>
      </div>
      <div id="topbarSpacer"></div>
      <div id="topbarRight">
        <span id="userBadge"></span>
        <button id="logoutBtnShell" onclick="Shell.logout()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/><path d="M9 8l-4 4 4 4"/><path d="M5 12h9"/></svg>Log out</button>
      </div>
    </div>
    <div id="pageContainer"></div>
  </div>
</div>

<script src="shared.js"></script>
<script src="shared-forms.js"></script>
<script>
  // PWA installability -- registers the service worker (see sw.js for why
  // it's network-first, not cache-first). Feature-checked and wrapped in
  // try/catch so this can never break the app for a browser that doesn't
  // support service workers at all.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* non-fatal */ });
    });
  }
</script>
</body>
</html>
